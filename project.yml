name: FlightFacts
options:
  bundleIdPrefix: com.cjcombs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

    # Automatic signing. Device builds are signed with the Apple Development
    # cert; the simulator ignores signing entirely, so one setting covers both.
    # Change DEVELOPMENT_TEAM if someone else builds this.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: HUYKA6BQUX
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"

targets:
  FlightFacts:
    type: application
    platform: iOS
    sources:
      - path: FlightFacts
        excludes:
          - "Resources/Info.plist"
      # Live Activity data contract + Lock Screen view, shared with the extension.
      - path: Shared
    dependencies:
      - target: FlightFactsLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cjcombs.flightfacts
        PRODUCT_NAME: Flight Facts
        INFOPLIST_FILE: FlightFacts/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    # No `info:` block on purpose — that would make XcodeGen *generate* the
    # plist and overwrite the hand-written one on every regenerate.
    scheme:
      testTargets:
        - FlightFactsTests

  # Lock Screen + Dynamic Island presentation of the active flight.
  FlightFactsLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: FlightFactsLiveActivity
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cjcombs.flightfacts.liveactivity
        PRODUCT_NAME: FlightFactsLiveActivity
        INFOPLIST_FILE: FlightFactsLiveActivity/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  FlightFactsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlightFactsTests
    dependencies:
      - target: FlightFacts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cjcombs.flightfacts.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
